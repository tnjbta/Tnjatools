<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>TNJA Approved Access Only</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;background:#fdfbfa;color:#241a1d;font-size:16px;line-height:1.55;
       font-family:"Inter","Helvetica Neue",Arial,sans-serif}
  /* No dark mode here on purpose. This is a front door, not a workspace: one white card
     with the Academy mark, the same on every machine that opens it. */
  :root{color-scheme:light}
  html,body{background:#fdfbfa;forced-color-adjust:none}
  .card{background:#fff;border:1px solid #ecdfe2;border-radius:18px;padding:32px 30px;
        width:100%;max-width:400px;box-shadow:0 8px 24px rgba(36,26,29,.09);text-align:center}
  .logo{height:70px;width:auto;display:block;margin:0 auto 18px}
  h1{font-family:Georgia,serif;font-size:21px;margin:0 0 8px;line-height:1.3}
  p{font-size:14px;color:#6b5b60;margin:0 0 20px}
  .pw{position:relative}
  input{font:inherit;font-size:16px;width:100%;padding:12px 48px 12px 14px;
        border:1px solid #ecdfe2;border-radius:11px;margin-bottom:12px;background:#fdfbfa}
  .eye{position:absolute;right:6px;top:9px;border:0;background:none;cursor:pointer;
       padding:7px;border-radius:9px;color:#6b5b60;line-height:0}
  .eye svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;
           stroke-linecap:round;stroke-linejoin:round}
  button[type=submit]{font:inherit;font-weight:700;font-size:15px;width:100%;padding:13px;
         border-radius:999px;border:0;background:#a63e5a;color:#fff;cursor:pointer}
  .err{color:#b45309;font-size:14px;margin-top:12px;min-height:20px}
</style>
</head>
